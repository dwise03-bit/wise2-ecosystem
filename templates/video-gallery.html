<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Video Gallery</title>
  <style>
    :root {
      --accent: #00ff88;
      --bg-primary: #0a0e1a;
      --bg-secondary: #0f1419;
      --fg-primary: #e0e6f0;
      --fg-secondary: #9ca3af;
      --border: #1e2432;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg-primary);
      color: var(--fg-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 18px;
      padding: 40px;
      zoom: 2;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-card {
      border: 2px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-secondary);
      transition: all 0.3s;
      cursor: pointer;
    }

    .video-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 255, 136, 0.2);
    }

    .video-card video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .video-info {
      padding: 16px;
    }

    .video-title {
      font-weight: 600;
      font-size: 16px;
      margin: 0 0 8px 0;
    }

    .video-desc {
      font-size: 14px;
      color: var(--fg-secondary);
      margin: 0;
    }

    h1 { font-size: 56px; margin: 0 0 32px 0; text-align: center; }
  </style>
</head>
<body>
  <h1>⬡ WISE² Video Gallery</h1>
  
  <div class="video-grid">
    <div class="video-card">
      <video controls preload="metadata">
        <source src="video1.mp4" type="video/mp4">
      </video>
      <div class="video-info">
        <p class="video-title">Demo 1</p>
        <p class="video-desc">Your first video</p>
      </div>
    </div>

    <div class="video-card">
      <video controls preload="metadata">
        <source src="video2.mp4" type="video/mp4">
      </video>
      <div class="video-info">
        <p class="video-title">Demo 2</p>
        <p class="video-desc">Your second video</p>
      </div>
    </div>
  </div>
</body>
</html>
