apiVersion: apps/v1
kind: Deployment
metadata:
  name: wise2-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wise2-app
  template:
    metadata:
      labels:
        app: wise2-app
    spec:
      containers:
      - name: wise2-app
        image: wise2-ecosystem:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
