version: '3.8'

services:
  web:
    build: .
    restart: always
    environment:
      NODE_ENV: production
      API_BASE_URL: https://api.wise2.net
    expose:
      - "3000"

  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8000
    expose:
      - "8000"

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: wise2_db
      POSTGRES_USER: wise2
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-wise2.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
