# WISE² Multi-domain NGINX Configuration
# Handles wise2.net and all subdomains

upstream api_backend {
  server 127.0.0.1:8000;
  keepalive 32;
}

upstream web_backend {
  server 127.0.0.1:3000;
  keepalive 32;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=50r/s;

# Redirect HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name wise2.net *.wise2.net;
  return 301 https://$server_name$request_uri;
}

# Main portal (wise2.net)
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name wise2.net www.wise2.net;

  ssl_certificate /etc/letsencrypt/live/wise2.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wise2.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  gzip on;
  gzip_types text/plain text/css text/javascript application/json application/javascript;

  location / {
    proxy_pass http://web_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache_bypass $http_upgrade;
  }
}

# API Gateway (api.wise2.net)
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.wise2.net;

  ssl_certificate /etc/letsencrypt/live/wise2.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wise2.net/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  limit_req zone=api_limit burst=200 nodelay;

  location / {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# AI Tools (ai.wise2.net)
