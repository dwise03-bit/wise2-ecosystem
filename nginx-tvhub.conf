# WISE² TV Hub - wise2.net Subdomain Configuration
# Hosts blakkhail.com display on tvhub.wise2.net

upstream tvhub_backend {
  server 127.0.0.1:3000;
  keepalive 32;
}

# HTTP to HTTPS redirect
server {
  listen 80;
  listen [::]:80;
  server_name tvhub.wise2.net;
  return 301 https://$server_name$request_uri;
}

# HTTPS - TV Hub Display
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name tvhub.wise2.net;

  ssl_certificate /etc/letsencrypt/live/wise2.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wise2.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Compression
  gzip on;
  gzip_types text/plain text/css text/javascript application/json application/javascript;

  # TV Hub main page
  location / {
    proxy_pass http://tvhub_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # Static files caching
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "TV Hub is operational\n";
    add_header Content-Type text/plain;
  }
}
