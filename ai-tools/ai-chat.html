<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WISE² AI Chat</title>
  <style>
    :root {
      --accent: #00ff88;
      --bg: #0a0e1a;
      --fg: #e0e6f0;
      --border: #1e2432;
      --msg-user: #1e3a5f;
      --msg-ai: #1a2f2a;
    }
    * { box-sizing: border-box; }
    html, body { 
      height: 100%; 
      margin: 0; 
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui;
    }
    
    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #0f1419;
      border-bottom: 1px solid var(--border);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title { 
      font-size: 18px;
      font-weight: bold;
      color: var(--accent);
    }

    .stats {
      font-size: 12px;
      color: #9ca3af;
      font-family: monospace;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 70%;
      word-wrap: break-word;
    }

    .message.user {
      background: var(--msg-user);
      align-self: flex-end;
      border-left: 3px solid var(--accent);
    }

    .message.ai {
      background: var(--msg-ai);
      align-self: flex-start;
      border-left: 3px solid var(--accent);
    }

    .message .role {
      font-size: 10px;
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 4px;
    }

    .message .text {
      font-size: 14px;
      line-height: 1.5;
    }

    .message .tokens {
      font-size: 10px;
      color: #6b7280;
      margin-top: 6px;
    }

    .input-area {
      border-top: 1px solid var(--border);
      padding: 16px;
      background: #0f1419;
      display: flex;
      gap: 8px;
    }

    .input-area textarea {
      flex: 1;
      background: #050709;
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 12px;
      border-radius: 6px;
      font-family: system-ui;
      font-size: 14px;
      resize: none;
      max-height: 120px;
    }

    .input-area textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.2);
    }

    .input-area button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .input-area button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 16px rgba(0, 255, 136, 0.4);
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .sidebar {
      position: absolute;
      left: 0;
      top: 0;
      width: 240px;
      height: 100%;
      background: #0f1419;
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      z-index: 10;
    }

    .sidebar h3 {
      color: var(--accent);
      font-size: 12px;
      text-transform: uppercase;
      margin-top: 0;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .model-select, .param-group {
      margin-bottom: 16px;
    }

    .model-select select, .param-group input {
      width: 100%;
      padding: 8px;
      background: #050709;
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 4px;
      font-size: 12px;
    }

    .param-label {
      font-size: 11px;
      color: #9ca3af;
      display: block;
      margin-bottom: 4px;
    }

    .main-chat {
      margin-left: 240px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>⚙️ Model Config</h3>
    
    <div class="model-select">
      <label class="param-label">Model</label>
      <select id="modelSelect">
        <option value="claude-opus">Claude Opus (Smart)</option>
        <option value="claude-sonnet">Claude Sonnet (Fast)</option>
        <option value="gpt-4">GPT-4 (OpenAI)</option>
        <option value="gpt-3.5">GPT-3.5 (Budget)</option>
        <option value="local-llama">Local LLaMA</option>
      </select>
    </div>

    <h3>🎛️ Parameters</h3>

    <div class="param-group">
      <label class="param-label">Temperature</label>
      <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
      <span id="tempValue">0.7</span>
    </div>

    <div class="param-group">
      <label class="param-label">Max Tokens</label>
      <input type="number" id="maxTokens" value="2048" min="100" max="8000">
    </div>

    <div class="param-group">
      <label class="param-label">Top P</label>
      <input type="range" id="topP" min="0" max="1" step="0.05" value="0.9">
      <span id="pValue">0.9</span>
    </div>

    <h3>📋 Prompts</h3>
    <button style="width: 100%; padding: 8px; background: var(--accent); color: var(--bg); border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 8px;">Save Prompt</button>
    <button style="width: 100%; padding: 8px; background: var(--border); color: var(--fg); border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Load Prompt</button>
  </div>

  <div class="main-chat">
    <div class="container">
      <div class="header">
        <div class="title">⬡ WISE² AI Assistant</div>
        <div class="stats">
          <span id="tokenCount">Tokens: 0</span> | 
          <span id="costEstimate">Cost: $0.00</span>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <textarea id="input" placeholder="Ask me anything..." rows="3"></textarea>
        <button id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // Model pricing (per 1M tokens)
    const pricing = {
      'claude-opus': { input: 15, output: 75 },
      'claude-sonnet': { input: 3, output: 15 },
      'gpt-4': { input: 30, output: 60 },
      'gpt-3.5': { input: 0.5, output: 1.5 },
      'local-llama': { input: 0, output: 0 }
    };

    let totalInputTokens = 0;
    let totalOutputTokens = 0;
    let conversationHistory = [];

    document.getElementById('temperature').addEventListener('input', (e) => {
      document.getElementById('tempValue').textContent = e.target.value;
    });

    document.getElementById('topP').addEventListener('input', (e) => {
      document.getElementById('pValue').textContent = e.target.value;
    });

    document.getElementById('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      
      if (!text) return;

      addMessage('user', text);
      input.value = '';
      input.focus();

      conversationHistory.push({ role: 'user', content: text });

      const model = document.getElementById('modelSelect').value;
      const temp = parseFloat(document.getElementById('temperature').value);
      const tokens = parseInt(document.getElementById('maxTokens').value);

      try {
        // Simulate API call
        const response = await callAI(model, conversationHistory, {
          temperature: temp,
          max_tokens: tokens
        });

        addMessage('ai', response.content, response.tokens);
        conversationHistory.push({ role: 'assistant', content: response.content });
        updateCostEstimate();
      } catch (error) {
        addMessage('ai', '⚠️ Error: ' + error.message);
      }
    }

    async function callAI(model, history, params) {
      // Simulated response
      const responses = [
        'I can help with that! This is a demonstration of the WISE² AI interface.',
        'Great question. The AI tools system is fully integrated with your WISE² ecosystem.',
        'Let me analyze that for you. Based on the context, I would suggest...'
      ];

      return new Promise(resolve => {
        setTimeout(() => {
          const content = responses[Math.floor(Math.random() * responses.length)];
          const estimatedTokens = Math.ceil(content.length / 4);
          
          totalInputTokens += 100;
          totalOutputTokens += estimatedTokens;
          
          resolve({
            content: content,
            tokens: { input: 100, output: estimatedTokens }
          });
        }, 800);
      });
    }

    function addMessage(role, content, tokens) {
      const messagesDiv = document.getElementById('messages');
      const messageEl = document.createElement('div');
      messageEl.className = `message ${role}`;
      
      let html = `<div class="role">${role.toUpperCase()}</div>`;
      html += `<div class="text">${escapeHtml(content)}</div>`;
      
      if (tokens) {
        html += `<div class="tokens">↔ ${tokens.input}/${tokens.output} tokens</div>`;
      }
      
      messageEl.innerHTML = html;
      messagesDiv.appendChild(messageEl);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateCostEstimate() {
      const model = document.getElementById('modelSelect').value;
      if (model === 'local-llama') {
        document.getElementById('costEstimate').textContent = 'Cost: Free (Local)';
      } else {
        const prices = pricing[model];
        const cost = (totalInputTokens * prices.input + totalOutputTokens * prices.output) / 1000000;
        document.getElementById('costEstimate').textContent = `Cost: $${cost.toFixed(4)}`;
      }
      
      document.getElementById('tokenCount').textContent = `Tokens: ${totalInputTokens + totalOutputTokens}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial message
    addMessage('ai', 'Welcome to WISE² AI Assistant. I can help you with questions, analysis, coding, and more. Choose your model and parameters on the left.');
  </script>
</body>
</html>
