<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="description" content="WISE² Mobile App">
  <link rel="manifest" href="manifest.json">
  <title>WISE² Android</title>
  <style>
    :root {
      --accent: #00ff88;
      --bg: #0a0e1a;
      --fg: #e0e6f0;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body { padding: 16px; }
    .app {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 { font-size: 32px; margin: 0 0 16px 0; }
  </style>
</head>
<body>
  <div class="app">
    <h1>⬡ WISE² Android</h1>
    <p>Progressive Web App - Install from Chrome</p>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
