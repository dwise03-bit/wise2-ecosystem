<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WISE² 3D Game Engine</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0e1a;
      font-family: system-ui;
      overflow: hidden;
    }
    #canvas { width: 100%; height: 100%; }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ff88;
      font-family: monospace;
      z-index: 100;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    WISE² 3D Engine | FPS: <span id="fps">60</span><br>
    Position: <span id="pos">0, 0, 0</span><br>
    Objects: <span id="objects">0</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/babylon.js/5.24.0/babylon.min.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const engine = new BABYLON.Engine(canvas, true);
    
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3(0.04, 0.055, 0.1);
    scene.collisionsEnabled = true;

    const camera = new BABYLON.UniversalCamera('camera', new BABYLON.Vector3(0, 5, 20));
    camera.attachControl(canvas, true);
    camera.inertia = 0.7;
    camera.angularSensibility = 1000;
    camera.speed = 0.15;
    camera.maxZ = 1000;

    // Lighting
    const light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 0.7;

    const pointLight = new BABYLON.PointLight('point', new BABYLON.Vector3(10, 20, 10), scene);
    pointLight.intensity = 0.8;
    pointLight.range = 100;

    // Ground
    const ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 100, height: 100 }, scene);
    const groundMaterial = new BABYLON.StandardMaterial('groundMat', scene);
    groundMaterial.diffuse = new BABYLON.Color3(0.06, 0.08, 0.15);
    ground.material = groundMaterial;

    // Hexagonal obstacles
    for (let i = 0; i < 5; i++) {
      const box = BABYLON.MeshBuilder.CreateBox('box' + i, { size: 2 }, scene);
      box.position = new BABYLON.Vector3(-20 + i * 10, 2, -10 + Math.random() * 20);
      
      const mat = new BABYLON.StandardMaterial('mat' + i, scene);
      mat.diffuse = new BABYLON.Color3(0.4, 1, 0.5);
      mat.specularColor = new BABYLON.Color3(0, 0, 0);
      box.material = mat;
    }

    // Rotating sphere
    const sphere = BABYLON.MeshBuilder.CreateSphere('sphere', { diameter: 3 }, scene);
    sphere.position = new BABYLON.Vector3(0, 5, 0);
    const sphereMat = new BABYLON.StandardMaterial('sphereMat', scene);
    sphereMat.emissiveColor = new BABYLON.Color3(0, 1, 0.5);
    sphere.material = sphereMat;

    // Animation
    let frameCount = 0;
    let lastTime = Date.now();

    engine.runRenderLoop(() => {
      sphere.rotation.y += 0.01;
      scene.render();

      // Update HUD
      frameCount++;
      const now = Date.now();
      if (now >= lastTime + 1000) {
        document.getElementById('fps').textContent = frameCount;
        frameCount = 0;
        lastTime = now;
      }

      const pos = camera.position;
      document.getElementById('pos').textContent = 
        pos.x.toFixed(1) + ', ' + pos.y.toFixed(1) + ', ' + pos.z.toFixed(1);
      document.getElementById('objects').textContent = scene.meshes.length;
    });

    window.addEventListener('resize', () => engine.resize());
  </script>
</body>
</html>
